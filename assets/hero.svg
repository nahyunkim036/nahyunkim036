<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A;#1E1B4B;#172554;#0F172A" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="48%" stop-color="#172554">
        <animate attributeName="stop-color" values="#172554;#312E81;#4C1D95;#172554" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#3B0764;#0C4A6E;#111827" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".34" stop-color="#818CF8"/>
      <stop offset=".67" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #CBD5E1; }
      .dim { fill: #94A3B8; }
      .white { fill: #F8FAFC; }
      .card { fill: #FFFFFF; fill-opacity: .055; stroke: #FFFFFF; stroke-opacity: .13; }
      .chip { fill: #FFFFFF; fill-opacity: .075; stroke: #FFFFFF; stroke-opacity: .12; }
      .float1 { animation: float1 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float2 { animation: float2 6.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .blink { animation: blink 1s steps(2,end) infinite; }
      .dash { stroke-dasharray: 8 12; animation: dash 12s linear infinite; }
      @keyframes float1 { 0%,100% { transform: translateY(0px);} 50% { transform: translateY(-8px);} }
      @keyframes float2 { 0%,100% { transform: translateY(0px);} 50% { transform: translateY(7px);} }
      @keyframes pulse { 0%,100% { opacity:.45;} 50% { opacity:1;} }
      @keyframes blink { 0%,45% { opacity:1;} 46%,100% { opacity:0;} }
      @keyframes dash { to { stroke-dashoffset:-240; } }
    </style>
  </defs>

  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>

  <!-- ambient color -->
  <circle cx="1030" cy="90" r="130" fill="#A855F7" fill-opacity=".14" filter="url(#soft)" class="pulse"/>
  <circle cx="140" cy="600" r="150" fill="#06B6D4" fill-opacity=".13" filter="url(#soft)" class="pulse"/>
  <circle cx="880" cy="570" r="120" fill="#F59E0B" fill-opacity=".08" filter="url(#soft)"/>

  <!-- top bar -->
  <circle cx="54" cy="50" r="5" fill="#22D3EE"/>
  <text x="70" y="56" class="mono white" font-size="15" letter-spacing="2">NAHYUN.DEV</text>
  <text x="1030" y="56" class="mono dim" font-size="13">DETROIT · MI</text>

  <!-- hero -->
  <text x="82" y="145" class="sans dim" font-size="18" font-weight="600" letter-spacing="3">SOFTWARE ENGINEER · CURIOUS BUILDER</text>

  <text x="78" y="220" class="sans white" font-size="64" font-weight="800" letter-spacing="-2">Nahyun Kim</text>

  <text x="82" y="265" class="sans muted" font-size="23" font-weight="500">
    Building thoughtful software with performance, clarity, and people in mind.
  </text>

  <rect x="82" y="295" width="510" height="3" rx="2" fill="url(#accent)"/>

  <!-- traits row -->
  <g class="float1">
    <rect x="82" y="325" width="165" height="42" rx="21" class="chip"/>
    <circle cx="105" cy="346" r="6" fill="#22D3EE"/>
    <text x="121" y="352" class="sans white" font-size="15" font-weight="600">Reliable teammate</text>
  </g>
  <g class="float2">
    <rect x="260" y="325" width="185" height="42" rx="21" class="chip"/>
    <circle cx="283" cy="346" r="6" fill="#A78BFA"/>
    <text x="299" y="352" class="sans white" font-size="15" font-weight="600">Clear communicator</text>
  </g>
  <g class="float1">
    <rect x="458" y="325" width="170" height="42" rx="21" class="chip"/>
    <circle cx="481" cy="346" r="6" fill="#F472B6"/>
    <text x="497" y="352" class="sans white" font-size="15" font-weight="600">Open to learning</text>
  </g>

  <!-- right identity map -->
  <rect x="735" y="115" width="375" height="250" rx="24" class="card"/>
  <text x="770" y="154" class="mono dim" font-size="13" letter-spacing="2">WHAT I BRING</text>

  <circle cx="820" cy="225" r="46" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".55"/>
  <text x="793" y="221" class="sans white" font-size="14" font-weight="700">SYSTEMS</text>
  <text x="800" y="241" class="mono dim" font-size="11">HPC · C++</text>

  <circle cx="940" cy="190" r="44" fill="#8B5CF6" fill-opacity=".13" stroke="#A78BFA" stroke-opacity=".55"/>
  <text x="921" y="186" class="sans white" font-size="14" font-weight="700">CLOUD</text>
  <text x="915" y="206" class="mono dim" font-size="11">AWS · K8s</text>

  <circle cx="1017" cy="270" r="43" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".55"/>
  <text x="1002" y="266" class="sans white" font-size="14" font-weight="700">AI</text>
  <text x="990" y="286" class="mono dim" font-size="11">Agents · LLM</text>

  <circle cx="905" cy="290" r="36" fill="#F59E0B" fill-opacity=".11" stroke="#FBBF24" stroke-opacity=".5"/>
  <text x="883" y="286" class="sans white" font-size="12" font-weight="700">PEOPLE</text>
  <text x="882" y="302" class="mono dim" font-size="9">teamwork</text>

  <path d="M856 215 C880 205, 895 200, 905 197" stroke="url(#accent)" stroke-width="2" fill="none" class="dash"/>
  <path d="M970 216 C1000 220, 1010 234, 1017 242" stroke="url(#accent)" stroke-width="2" fill="none" class="dash"/>
  <path d="M986 279 C960 285, 945 289, 932 290" stroke="url(#accent)" stroke-width="2" fill="none" class="dash"/>
  <path d="M884 269 C865 255, 851 244, 844 239" stroke="url(#accent)" stroke-width="2" fill="none" class="dash"/>

  <!-- bottom dashboard -->
  <rect x="82" y="408" width="1028" height="190" rx="24" class="card"/>

  <line x1="420" y1="435" x2="420" y2="570" stroke="#FFFFFF" stroke-opacity=".11"/>
  <line x1="760" y1="435" x2="760" y2="570" stroke="#FFFFFF" stroke-opacity=".11"/>

  <!-- current -->
  <text x="112" y="445" class="mono dim" font-size="12" letter-spacing="2">CURRENT</text>
  <text x="112" y="480" class="sans white" font-size="18" font-weight="700">Wayne State University</text>
  <text x="112" y="507" class="sans muted" font-size="15">Computer Science</text>
  <text x="112" y="534" class="sans muted" font-size="15">HPC Research Assistant</text>
  <text x="112" y="561" class="sans muted" font-size="15">Course Student Assistant</text>

  <!-- focus -->
  <text x="450" y="445" class="mono dim" font-size="12" letter-spacing="2">FOCUS</text>
  <text x="450" y="480" class="sans white" font-size="18" font-weight="700">Explore broadly. Build deeply.</text>
  <text x="450" y="510" class="sans muted" font-size="14">Performance Engineering · Cloud · AI</text>
  <text x="450" y="536" class="sans muted" font-size="14">Backend · DevOps · Full-stack collaboration</text>
  <text x="450" y="562" class="sans muted" font-size="14">Always open to new domains & challenges</text>

  <!-- work -->
  <text x="790" y="445" class="mono dim" font-size="12" letter-spacing="2">SELECTED WORK</text>
  <text x="790" y="481" class="sans white" font-size="17" font-weight="700">CivicShield</text>
  <text x="910" y="481" class="mono" fill="#F472B6" font-size="12">AI Security</text>
  <text x="790" y="515" class="sans white" font-size="17" font-weight="700">GOMC</text>
  <text x="910" y="515" class="mono" fill="#22D3EE" font-size="12">HPC · C++</text>
  <text x="790" y="549" class="sans white" font-size="17" font-weight="700">Uniplan</text>
  <text x="910" y="549" class="mono" fill="#FBBF24" font-size="12">Backend</text>

  <!-- footer -->
  <text x="82" y="640" class="mono dim" font-size="12">RESPONSIBILITY</text>
  <circle cx="215" cy="635" r="3" fill="#22D3EE"/>
  <text x="230" y="640" class="mono dim" font-size="12">COMMUNICATION</text>
  <circle cx="355" cy="635" r="3" fill="#A78BFA"/>
  <text x="370" y="640" class="mono dim" font-size="12">CURIOSITY</text>
  <circle cx="453" cy="635" r="3" fill="#F472B6"/>
  <text x="468" y="640" class="mono dim" font-size="12">ADAPTABILITY</text>

  <text x="1018" y="640" class="mono white" font-size="12">BUILD · LEARN · SHARE</text>
  <rect x="1140" y="628" width="8" height="16" rx="1" fill="#22D3EE" class="blink"/>
</svg>
